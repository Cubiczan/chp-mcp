name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: MCP stdio smoke — handshake, version, tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
          | node dist/index.js > /tmp/out.ndjson

          # serverInfo.version must track package.json. It drifted to 0.1.0 once
          # while the package was 0.1.1, and Glama and MCP clients surface
          # whatever the server reports.
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          grep -q "\"version\":\"${PKG_VERSION}\"" /tmp/out.ndjson

          for tool in evaluate_spend_gate approve_spend chp_content_hash chp_version; do
            grep -q "\"$tool\"" /tmp/out.ndjson
          done

      - name: Launch through the bin entry, as an MCP client would
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
          | node "$(node -p 'require("./package.json").bin["chp-mcp"]')" | grep -q '"serverInfo"'

  registry-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: server.json must agree with package.json
        # A registry entry pointing at a version that does not exist on npm is
        # rejected at publish time; catching it here is cheaper.
        run: |
          PKG="$(node -p 'require("./package.json").version')"
          SRV="$(node -p 'require("./server.json").version')"
          PKGREF="$(node -p 'require("./server.json").packages[0].version')"
          echo "package.json=$PKG  server.json=$SRV  server.json packages[0]=$PKGREF"
          test "$PKG" = "$SRV"
          test "$PKG" = "$PKGREF"
      - name: server.json description within the registry's 100-char cap
        run: |
          LEN="$(node -p 'require("./server.json").description.length')"
          echo "description length: $LEN / 100"
          test "$LEN" -le 100
